services:
  fleetcontrol:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - frps
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    ports:
      - "8095:8080"
    volumes:
      - ./data:/data
      - ./secrets:/secrets:ro

  frps:
    build: ./frps
    restart: unless-stopped
    env_file: .env
    environment:
      FRP_TOKEN: ${FRP_TOKEN}
      FRP_REMOTE_PORT_START: ${FRP_REMOTE_PORT_START:-41000}
      FRP_REMOTE_PORT_END: ${FRP_REMOTE_PORT_END:-41099}
