services:
  fleetcontrol:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PUBLIC_URL: https://${DOMAIN}
      GOOGLE_SA_KEY_FILE: ${GOOGLE_SA_KEY_FILE:-}
    volumes:
      - ./data:/data
      - ./secrets:/secrets:ro      # coloca aquí la llave JSON de Google
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
volumes:
  caddy_data:
